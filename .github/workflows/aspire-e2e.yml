name: Aspire E2E

on:
  workflow_dispatch:

jobs:
  core:
    name: Core Aspire and browser E2E
    runs-on: [self-hosted, pole-e2e]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/api/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix src/api/frontend

      - name: Install Chromium
        shell: pwsh
        run: |
          dotnet build tests/Pole.Tests.E2E/Pole.Tests.E2E.csproj --nologo
          ./tests/Pole.Tests.E2E/bin/Debug/net11.0/playwright.ps1 install chromium

      - name: Run Aspire E2E tests
        run: dotnet test tests/Pole.Tests.E2E/Pole.Tests.E2E.csproj --no-build --nologo -maxcpucount:1
