name: Test

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: pole-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend and Kubernetes E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      POLE_K8S_LAB_RUNTIME: docker
      POLE_TEST_WORKTREE_ID: ci-${{ github.run_id }}
      POLE_TEST_RUN_ID: attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf -- /usr/local/lib/android
          docker system prune --all --force
          used_percent="$(df --output=pcent / | tail -n 1 | tr -dc '0-9')"
          if (( used_percent > 75 )); then
            echo "Only $((100 - used_percent))% of the runner filesystem is available after cleanup." >&2
            exit 1
          fi
          df -h /

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-rc.1.26425.128

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/api/frontend/package-lock.json

      - name: Install frontend runtime dependencies
        run: npm ci --prefix src/api/frontend

      - name: Restore backend
        run: dotnet restore Pole.slnx --disable-build-servers --nologo -maxcpucount:1 -nodeReuse:false

      - name: Build backend
        run: dotnet build Pole.slnx --no-restore --disable-build-servers --nologo -maxcpucount:1 -nodeReuse:false

      - name: Check source formatting
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/master' }}
        run: python3 scripts/quality_gate.py check-format --base "$FORMAT_BASE"

      - name: Test delivery automation and lab recovery
        run: |
          python3 scripts/run_script_tests.py
          for test_script in infrastructure/kubernetes-lab/tests/*.sh; do
            bash "$test_script"
          done

      - name: Restore coverage report tool
        run: dotnet tool restore

      - name: Start and verify the full lab
        run: |
          ./infrastructure/kubernetes-lab/lab.sh up
          ./infrastructure/kubernetes-lab/lab.sh verify

      - name: Run all backend tests with coverage
        run: |
          dotnet test --no-build --no-restore --nologo -maxcpucount:1 -nodeReuse:false \
            --collect:"Code Coverage;Format=Cobertura" --logger trx \
            --results-directory .artifacts/coverage/backend/raw

      - name: Reject failed, skipped, or missing backend suites
        run: python3 scripts/quality_gate.py check-backend-reports --directory .artifacts/coverage/backend/raw

      - name: Generate backend coverage report
        run: |
          dotnet tool run reportgenerator \
            "-reports:.artifacts/coverage/backend/raw/**/*.cobertura.xml" \
            "-targetdir:.artifacts/coverage/backend/report" \
            "-reporttypes:Html;Cobertura;MarkdownAssembliesSummary" \
            "-assemblyfilters:+Pole.*;-*.Tests*;-Pole.Testing;-Pole.ArchitectureAnalyzers" \
            "-filefilters:-**/obj/**;-**/*.g.cs;-**/*.generated.cs" \
            "-title:Pole backend coverage"
          {
            cat .artifacts/coverage/backend/report/Summary.md
            echo
            echo "> Aspire workloads that execute outside the test host are not included in this report."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: .artifacts/coverage/backend/report
          retention-days: 14

      - name: Reject leaked test resources
        if: always()
        run: ./infrastructure/kubernetes-lab/lab.sh audit-tests

      - name: Lab diagnostics
        if: failure()
        run: |
          set +e
          df -h
          free -h
          docker system df
          docker ps --all
          ./infrastructure/kubernetes-lab/lab.sh status
          state=.tmp/kubernetes-lab/state.json
          if [[ ! -f "${state}" ]]; then
            echo "Lab state '${state}' is unavailable; skipping Kubernetes diagnostics."
            exit 0
          fi
          kubectl="$(jq --raw-output '.tools.kubectlPath' "${state}")"
          if [[ ! -x "${kubectl}" ]]; then
            echo "Pinned kubectl '${kubectl}' is unavailable; skipping Kubernetes diagnostics."
            exit 0
          fi
          while IFS=$'\t' read -r target kubeconfig context; do
            echo "::group::Kubernetes target ${target}"
            "${kubectl}" --kubeconfig "${kubeconfig}" --context "${context}" describe nodes
            "${kubectl}" --kubeconfig "${kubeconfig}" --context "${context}" \
              get pods --all-namespaces --output wide
            "${kubectl}" --kubeconfig "${kubeconfig}" --context "${context}" \
              get events --all-namespaces --sort-by=.metadata.creationTimestamp
            echo "::endgroup::"
          done < <(jq --raw-output '.targets[] | [.key, .kubeconfigPath, .context] | @tsv' "${state}")

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/api/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix src/api/frontend

      - name: Test with coverage
        run: npm run test:coverage --prefix src/api/frontend -- --reporter=default --reporter=json --outputFile=coverage/tests.json

      - name: Reject failed or skipped frontend tests
        run: python3 scripts/quality_gate.py check-frontend-report --report src/api/frontend/coverage/tests.json

      - name: Lint
        run: npm run lint --prefix src/api/frontend

      - name: Add frontend coverage summary
        run: |
          jq --raw-output '
            def row($name; $value):
              "| \($name) | \($value.covered) | \($value.total) | \($value.pct)% |";
            .total |
              "## Frontend coverage\n\n" +
              "| Metric | Covered | Total | Coverage |\n" +
              "| --- | ---: | ---: | ---: |\n" +
              row("Lines"; .lines) + "\n" +
              row("Branches"; .branches) + "\n" +
              row("Functions"; .functions) + "\n" +
              row("Statements"; .statements)
          ' src/api/frontend/coverage/coverage-summary.json >> "${GITHUB_STEP_SUMMARY}"

      - name: Build
        run: npm run build --prefix src/api/frontend

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: src/api/frontend/coverage
          retention-days: 14
