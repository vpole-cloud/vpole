name: Test

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: pole-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selection:
    name: Scope and structural checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      behavioral: ${{ steps.scope.outputs.behavioral }}
      automation: ${{ steps.scope.outputs.automation }}
      template: ${{ steps.scope.outputs.template }}
      template_format: ${{ steps.scope.outputs.template_format }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.100-rc.3.26522.148
            10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select checks from the complete change
        id: scope
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/master' }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          force=()
          if [[ "$FORCE_FULL" == true ]]; then force=(--force-full); fi
          python3 scripts/quality_gate.py plan --base "$REVIEW_BASE" "${force[@]}" --output .artifacts/scope.json --github-output "$GITHUB_OUTPUT"
          python3 scripts/quality_gate.py checks --base "$REVIEW_BASE" "${force[@]}"
      - name: Upload selection evidence
        uses: actions/upload-artifact@v4
        with:
          name: verification-scope
          path: .artifacts/scope.json
          retention-days: 14

  feature-template:
    needs: selection
    if: needs.selection.outputs.template == 'true' || needs.selection.outputs.template_format == 'true'
    name: Generated feature example
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POLE_TEST_WORKTREE_ID: ft-${{ github.run_id }}
      POLE_TEST_RUN_ID: attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.100-rc.3.26522.148
            10.0.x
      - name: Test generator and checker automation
        if: needs.selection.outputs.automation == 'true'
        run: python3 scripts/run_script_tests.py
      - name: Verify the generated feature for the selected mode
        env:
          FORMAT_ONLY: ${{ needs.selection.outputs.template_format }}
        run: |
          flags=()
          mode=complete
          if [[ "$FORMAT_ONLY" == true ]]; then flags=(--format-only); mode=format-only; fi
          python3 scripts/check_feature_template.py --results-directory .artifacts/feature-template/ci "${flags[@]}"
          python3 scripts/quality_gate.py check-template-report --report .artifacts/feature-template/ci/result.json --mode "$mode"
      - name: Upload bounded template validation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-template-result
          path: .artifacts/feature-template/ci/result.json
          retention-days: 14

  backend:
    needs: selection
    if: needs.selection.outputs.behavioral == 'true'
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 240 || 120 }}
    env:
      POLE_K8S_LAB_RUNTIME: docker
      POLE_TEST_WORKTREE_ID: ci-${{ github.run_id }}
      POLE_TEST_RUN_ID: attempt-${{ github.run_attempt }}
      POLE_TEST_EVIDENCE_DIRECTORY: ${{ github.workspace }}/.artifacts/test-phases
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reclaim runner disk space
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo rm -rf -- /usr/local/lib/android
          docker system prune --all --force
          used_percent="$(df --output=pcent / | tail -n 1 | tr -dc '0-9')"
          if (( used_percent > 75 )); then
            echo "Only $((100 - used_percent))% of the runner filesystem is available after cleanup." >&2
            exit 1
          fi
          df -h /

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.100-rc.3.26522.148

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/api/frontend/package-lock.json

      - name: Install frontend runtime dependencies
        if: github.event_name == 'workflow_dispatch'
        run: npm ci --prefix src/api/frontend

      - name: Restore backend
        run: dotnet restore Pole.slnx --disable-build-servers --nologo -maxcpucount:2 -nodeReuse:false

      - name: Build backend
        run: dotnet build Pole.slnx --no-restore --disable-build-servers --nologo -maxcpucount:2 -nodeReuse:false

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Check source formatting
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/master' }}
        run: python3 scripts/quality_gate.py check-format --base "$FORMAT_BASE"

      - name: Upload CleanupCode report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanupcode-formatting
          path: .artifacts/cleanupcode/**/report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Test delivery automation and lab recovery
        run: |
          python3 scripts/run_script_tests.py
          for test_script in infrastructure/kubernetes-lab/tests/*.sh; do
            bash "$test_script"
          done

      - name: Start and verify the full lab
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 scripts/quality_gate.py headroom --results-directory .artifacts/coverage/backend/raw --phase before-lab
          ./infrastructure/kubernetes-lab/lab.sh up
          ./infrastructure/kubernetes-lab/lab.sh verify
          python3 scripts/quality_gate.py headroom --results-directory .artifacts/coverage/backend/raw --phase after-lab

      - name: Run selected backend suites with coverage
        run: python3 scripts/quality_gate.py backend --results-directory .artifacts/coverage/backend/raw --profile "${{ github.event_name == 'workflow_dispatch' && 'full' || 'pr' }}"

      - name: Reject failed, skipped, or missing backend suites
        if: ${{ !cancelled() }}
        run: python3 scripts/quality_gate.py check-backend-reports --profile "${{ github.event_name == 'workflow_dispatch' && 'full' || 'pr' }}" --directory .artifacts/coverage/backend/raw

      - name: Generate backend coverage report
        run: |
          dotnet tool run reportgenerator \
            "-reports:.artifacts/coverage/backend/raw/**/*.cobertura.xml" \
            "-targetdir:.artifacts/coverage/backend/report" \
            "-reporttypes:Html;Cobertura;MarkdownAssembliesSummary" \
            "-filefilters:-**/obj/**;-**/*.g.cs;-**/*.generated.cs" \
            "-title:Pole backend coverage"
          {
            cat .artifacts/coverage/backend/report/Summary.md
            echo
            echo "> Aspire workloads that execute outside the test host are not included in this report."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: .artifacts/coverage/backend/report
          retention-days: 14

      - name: Reject leaked test resources
        if: always() && github.event_name == 'workflow_dispatch'
        run: ./infrastructure/kubernetes-lab/lab.sh audit-tests

      - name: Snapshot failed runner headroom
        if: failure()
        run: python3 scripts/quality_gate.py headroom --results-directory .artifacts/coverage/backend/raw --phase failed-run

      - name: Export safe test evidence
        if: always()
        run: >-
          python3 scripts/export_test_evidence.py
          --input .artifacts/coverage/backend/raw
          --phases-directory .artifacts/test-phases
          --output .artifacts/ci-safe

      - name: Upload safe test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence
          path: .artifacts/ci-safe
          retention-days: 14

      - name: Lab diagnostics
        if: failure() && github.event_name == 'workflow_dispatch'
        run: |
          set +e
          df -h
          free -h
          docker system df
          docker ps --all
          ./infrastructure/kubernetes-lab/lab.sh status
          state=.tmp/kubernetes-lab/state.json
          if [[ ! -f "${state}" ]]; then
            echo "Lab state '${state}' is unavailable; skipping Kubernetes diagnostics."
            exit 0
          fi
          kubectl="$(jq --raw-output '.tools.kubectlPath' "${state}")"
          if [[ ! -x "${kubectl}" ]]; then
            echo "Pinned kubectl '${kubectl}' is unavailable; skipping Kubernetes diagnostics."
            exit 0
          fi
          while IFS=$'\t' read -r target kubeconfig context; do
            echo "::group::Kubernetes target ${target}"
            "${kubectl}" --kubeconfig "${kubeconfig}" --context "${context}" describe nodes
            "${kubectl}" --kubeconfig "${kubeconfig}" --context "${context}" \
              get pods --all-namespaces --output wide
            "${kubectl}" --kubeconfig "${kubeconfig}" --context "${context}" \
              get events --all-namespaces --sort-by=.metadata.creationTimestamp
            echo "::endgroup::"
          done < <(jq --raw-output '.targets[] | [.key, .kubeconfigPath, .context] | @tsv' "${state}")

  frontend:
    needs: selection
    if: needs.selection.outputs.behavioral == 'true'
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/api/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix src/api/frontend

      - name: Test with coverage
        run: npm run test:coverage --prefix src/api/frontend -- --reporter=default --reporter=json --outputFile=coverage/tests.json

      - name: Reject failed or skipped frontend tests
        run: python3 scripts/quality_gate.py check-frontend-report --report src/api/frontend/coverage/tests.json

      - name: Lint
        run: npm run lint --prefix src/api/frontend

      - name: Add frontend coverage summary
        run: |
          jq --raw-output '
            def row($name; $value):
              "| \($name) | \($value.covered) | \($value.total) | \($value.pct)% |";
            .total |
              "## Frontend coverage\n\n" +
              "| Metric | Covered | Total | Coverage |\n" +
              "| --- | ---: | ---: | ---: |\n" +
              row("Lines"; .lines) + "\n" +
              row("Branches"; .branches) + "\n" +
              row("Functions"; .functions) + "\n" +
              row("Statements"; .statements)
          ' src/api/frontend/coverage/coverage-summary.json >> "${GITHUB_STEP_SUMMARY}"

      - name: Build
        run: npm run build --prefix src/api/frontend

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            src/api/frontend/coverage
            !src/api/frontend/coverage/tests.json
          retention-days: 14

      - name: Export safe frontend test evidence
        if: always()
        run: >-
          python3 scripts/export_test_evidence.py
          --input src/api/frontend/coverage
          --phases-directory .artifacts/frontend-test-phases
          --frontend-report src/api/frontend/coverage/tests.json
          --output .artifacts/frontend-ci-safe

      - name: Upload safe frontend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-evidence
          path: .artifacts/frontend-ci-safe
          if-no-files-found: error
          retention-days: 14

  verification:
    name: Required verification
    if: always()
    needs: [selection, feature-template, backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject missing, failed or cancelled selected jobs
        env:
          GATE_CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/quality_gate.py check-ci
